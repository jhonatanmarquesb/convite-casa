<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite de hoje 💚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#081810;
    --bg-mid:#0f2a1c;
    --bg-mid2:#12331f;
    --green-soft:#8fc3a4;
    --green-dim:#3f6b52;
    --gold:#e8c46b;
    --gold-bright:#f6dd9a;
    --cream:#f6f1e3;
    --cream-dim:#cfd9cd;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    min-height:100vh;
    font-family:'Manrope', sans-serif;
    color:var(--cream);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(143,195,164,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%, rgba(232,196,107,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-mid2) 100%);
    overflow:hidden;
    position:relative;
  }

  .fireflies{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .firefly{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px 2px rgba(246,221,154,0.6), 0 0 14px 5px rgba(232,196,107,0.2);
    opacity:0; animation:drift linear infinite, flicker ease-in-out infinite;
  }
  @keyframes drift{
    0%{transform:translate(0,0);} 25%{transform:translate(25px,-35px);}
    50%{transform:translate(-15px,-70px);} 75%{transform:translate(-35px,-25px);}
    100%{transform:translate(0,0);}
  }
  @keyframes flicker{ 0%,100%{opacity:.12;} 50%{opacity:.85;} }

  .stage{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%; max-width:480px;
    text-align:center;
    animation:fadeIn 1s ease both;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    font-size:12px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--green-soft); opacity:.85; margin-bottom:16px;
  }
  h1{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:clamp(26px,6.5vw,36px); color:var(--cream); margin-bottom:14px; line-height:1.3;
  }
  h1 em{ font-style:normal; font-weight:600; color:var(--gold-bright); }

  .msg{
    font-family:'Fraunces', serif; font-weight:300; font-size:17px;
    color:var(--cream-dim); margin-bottom:44px; min-height:26px;
    transition:opacity .2s ease;
  }

  .buttons{
    display:flex; align-items:center; justify-content:center;
    gap:16px; flex-wrap:wrap;
    min-height:120px;
  }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Manrope', sans-serif; font-weight:700;
    letter-spacing:.02em;
    border-radius:999px;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), padding .25s ease, font-size .25s ease, box-shadow .25s ease;
  }

  #simBtn{
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#25321f;
    font-size:15px;
    padding:16px 34px;
    box-shadow:0 8px 24px rgba(232,196,107,0.25);
  }
  #simBtn:hover{ filter:brightness(1.03); }

  #naoBtn{
    background:transparent;
    color:var(--cream-dim);
    border:1px solid rgba(246,241,227,0.25);
    font-size:14px;
    padding:14px 26px;
  }
  #naoBtn:hover{ border-color:rgba(246,241,227,0.45); }

  #confirmed{
    display:none;
  }
  #confirmed.show{ display:block; animation:fadeIn .8s ease both; }
  #confirmed .heart{ font-size:34px; margin-bottom:14px; }
  #confirmed h2{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:clamp(22px,5.5vw,30px); color:var(--gold-bright); margin-bottom:12px;
  }
  #confirmed p{
    font-family:'Fraunces', serif; font-size:16.5px; color:var(--cream-dim);
    font-weight:300; max-width:340px; margin:0 auto;
  }

  #inviteScreen.hide{ display:none; }

  @media (prefers-reduced-motion: reduce){ .firefly{ animation:none; opacity:.35; } }
</style>
</head>
<body>

<div class="fireflies" id="fireflies"></div>

<div class="stage">
  <div class="card" id="inviteScreen">
    <div class="eyebrow">convite de hoje</div>
    <h1>Bora lá em <em>casa</em> hoje? 💚</h1>
    <div class="msg" id="msg">só assistir um filme mesmo.</div>
    <div class="buttons">
      <button class="btn" id="simBtn" onclick="confirmar()">Sim, bora! 💚</button>
      <button class="btn" id="naoBtn" onclick="recusar()">Não</button>
    </div>
  </div>

  <div class="card" id="confirmed">
    <div class="heart">💚</div>
    <h2>Combinado então!</h2>
    <p>Eu te busco mais tarde</p>
     <p>Sabia que ia aceitar o convite por livre e espontânea vontade</p>
  </div>
</div>

<script>
  const fireContainer = document.getElementById('fireflies');
  const count = window.innerWidth < 500 ? 20 : 34;
  for(let i=0;i<count;i++){
    const f = document.createElement('div');
    f.className = 'firefly';
    const size = 3 + Math.random()*3;
    f.style.width = size+'px';
    f.style.height = size+'px';
    f.style.left = Math.random()*100+'vw';
    f.style.top = Math.random()*100+'vh';
    const driftDur = 6 + Math.random()*8;
    const flickerDur = 2 + Math.random()*3;
    f.style.animationDuration = driftDur+'s, '+flickerDur+'s';
    f.style.animationDelay = (Math.random()*5)+'s, '+(Math.random()*5)+'s';
    fireContainer.appendChild(f);
  }

  const simBtn = document.getElementById('simBtn');
  const naoBtn = document.getElementById('naoBtn');
  const msgEl = document.getElementById('msg');

  let naoCount = 0;
  const messages = [
    'só assistir um filme mesmo.',
    'tem certeza?',
    'pensa direito antes de clicar de novo...',
    'o botão sim já tá ficando com ciúmes',
    'tá difícil, hein',
    'já dá pra ver que você quer clicar no sim',
    'o não tá cansado de ser clicado',
    'vai continuar assim até quando?',
    'ok, você é teimosa.',
    'só clica no sim logo'
  ];

  function recusar(){
    naoCount++;
    const scale = Math.min(1 + naoCount * 0.22, 4.2);
    simBtn.style.transform = `scale(${scale})`;

    const shrink = Math.max(1 - naoCount * 0.07, 0.55);
    naoBtn.style.transform = `scale(${shrink})`;
    naoBtn.style.opacity = Math.max(1 - naoCount * 0.06, 0.4);

    const idx = Math.min(naoCount - 1, messages.length - 1);
    msgEl.textContent = messages[idx];

    if(naoCount >= messages.length){
      naoBtn.disabled = true;
      naoBtn.style.cursor = 'default';
    }
  }

  function confirmar(){
    document.getElementById('inviteScreen').classList.add('hide');
    document.getElementById('confirmed').classList.add('show');
  }
</script>

</body>
</html>
